<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Anesthetic Consult</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f4f8;
        color: #2c3e50;
        line-height: 1.6;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        margin: 0;
    }
    .form-container {
        background-color: #ffffff;
        width: 100%;
        max-width: 800px;
        padding: 50px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border-radius: 12px;
        border-top: 6px solid #3498db;
    }
    h1 {
        text-align: center;
        color: #2c3e50;
        font-size: 28px;
        margin-top: 0;
        margin-bottom: 40px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    h2 {
        color: #34495e;
        font-size: 20px;
        margin-top: 40px;
        border-bottom: 2px solid #ecf0f1;
        padding-bottom: 8px;
        margin-bottom: 20px;
    }
    .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 20px;
    }
    .field {
        display: flex;
        align-items: flex-end;
        margin-bottom: 15px;
    }
    .field label {
        font-weight: 600;
        margin-right: 12px;
        white-space: nowrap;
        color: #34495e;
    }
    .field input[type="text"] {
        flex-grow: 1;
        border: none;
        border-bottom: 1px solid #bdc3c7;
        background: transparent;
        padding: 5px 2px;
        font-size: 16px;
        color: #2c3e50;
        transition: border-color 0.3s;
    }
    .field input[type="text"]:focus {
        outline: none;
        border-bottom: 2px solid #3498db;
    }
    .half-width {
        flex: 1;
        min-width: 300px;
    }
    .full-width {
        width: 100%;
    }
    .options-group {
        display: flex;
        align-items: center;
        gap: 20px;
    }
    .radio-label {
        font-weight: 400;
        display: flex;
        align-items: center;
        cursor: pointer;
    }
    .radio-label input {
        margin-right: 6px;
        cursor: pointer;
    }
    /* Grid for Airway Evaluation */
    .airway-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 30px;
    }
    
    @media print {
        body {
            background-color: #ffffff;
            padding: 0;
        }
        .form-container {
            box-shadow: none;
            border: none;
            padding: 0;
            max-width: 100%;
        }
    }
</style>
</head>
<body>

<div class="form-container">
    <h1>General Anesthetic Consult</h1>
    
    <div class="row">
        <div class="field half-width">
            <label>Name:</label>
            <input type="text">
        </div>
        <div class="field half-width">
            <label>Chart #:</label>
            <input type="text">
        </div>
    </div>

    <div class="field full-width">
        <label>Allergies reviewed:</label>
        <input type="text">
    </div>

    <div class="field full-width">
        <label>Current medications:</label>
        <input type="text">
    </div>

    <div class="field full-width">
        <label>Physical/neurological impairments:</label>
        <input type="text">
    </div>

    <div class="field full-width">
        <label>Previous sedation/anesthesia:</label>
        <input type="text">
    </div>

    <div class="field full-width">
        <label>Snoring/apnea/mouth breather:</label>
        <input type="text">
    </div>

    <div class="field full-width">
        <label>Family history of anesthesia:</label>
        <input type="text">
    </div>

    <h2>Airway Evaluation</h2>
    <div class="airway-grid">
        <div class="field">
            <label>Limited opening:</label>
            <input type="text">
        </div>
        <div class="field">
            <label>Neck limitation:</label>
            <input type="text">
        </div>
        <div class="field">
            <label>Retrognathia:</label>
            <input type="text">
        </div>
        <div class="field">
            <label>Macroglossia:</label>
            <input type="text">
        </div>
    </div>
    
    <div class="field full-width options-group" style="margin-top: 25px;">
        <label>Tonsils (Brodsky):</label>
        <label class="radio-label"><input type="radio" name="tonsils" value="1"> 1</label>
        <label class="radio-label"><input type="radio" name="tonsils" value="2"> 2</label>
        <label class="radio-label"><input type="radio" name="tonsils" value="3"> 3</label>
        <label class="radio-label"><input type="radio" name="tonsils" value="4"> 4</label>
    </div>

    <div class="field full-width options-group" style="margin-top: 15px;">
        <label>ASA:</label>
        <label class="radio-label"><input type="radio" name="asa" value="I"> I</label>
        <label class="radio-label"><input type="radio" name="asa" value="II"> II</label>
        <label class="radio-label"><input type="radio" name="asa" value="III"> III</label>
        <label class="radio-label"><input type="radio" name="asa" value="IV"> IV</label>
    </div>

    <div class="row" style="margin-top: 25px;">
        <div class="field full-width options-group">
            <label>Consult with anesthesia:</label>
            <label class="radio-label"><input type="radio" name="consult" value="Y"> Y</label>
            <label class="radio-label"><input type="radio" name="consult" value="N"> N</label>
        </div>
    </div>

    <div class="field full-width">
        <label>If yes, reason:</label>
        <input type="text">
    </div>

</div>

</body>
</html>
